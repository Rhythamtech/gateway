server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Keep inference streams unbuffered and allow long-running provider calls.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://[^/]+(/.*)$ /api$1;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Swagger emits an absolute schema URL. Add its external base path so
    # "Try it out" sends requests through the same proxy as the dashboard.
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"openapi":' '"servers":[{"url":"/api"}],"openapi":';
    }

    location /static/ {
        proxy_pass http://api:8000/static/;
    }

    # Also expose the standard SDK base URL without the dashboard prefix.
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
